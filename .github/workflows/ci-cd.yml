# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Compliance — SEO, Security & Bundle Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: every job inherits read-only contents access.
# This workflow only audits/validates; nothing here writes to the repo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  CACHE_VERSION: v3

jobs:
  seo-validation:
    name: SEO & Structured Data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate required meta tags
        run: |
          failed=0
          check() {
            if grep -q "$2" index.html; then
              echo "  ok  $1"
            else
              echo "  FAIL $1 (pattern: $2)"
              failed=1
            fi
          }
          check "charset"       '<meta charset'
          check "viewport"      'name="viewport"'
          check "description"   'name="description"'
          check "og:title"      'og:title'
          check "canonical"     'rel="canonical"'
          check "schema.org"    'application/ld+json'
          check "CSP header"    'Content-Security-Policy'
          check "referrer"      'referrer'
          exit $failed

      - name: Validate sitemap.xml
        run: |
          test -f sitemap.xml \
            && echo "  ok  sitemap.xml ($(wc -l < sitemap.xml) lines)" \
            || { echo "  FAIL sitemap.xml MISSING"; exit 1; }

      - name: Validate robots.txt
        run: |
          test -f robots.txt \
            && echo "  ok  robots.txt" \
            || { echo "  FAIL robots.txt MISSING"; exit 1; }

  security-audit:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ env.CACHE_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Full security audit (CVEs + static analysis + HTTPS + CSP)
        run: npm run audit:security

  bundle-integrity:
    name: Bundle Integrity & Performance Budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ env.CACHE_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      # Round 20 (option B): the deployable artefact lives under
      # `.deploy/`, gitignored on `main`. Run the full build chain here
      # so the integrity checks below validate the same bytes the
      # deploy workflow will publish to gh-pages.
      - name: Build production artefact
        run: npm run build

      - name: Verify .deploy/ outputs exist
        run: |
          test -f .deploy/dist/style-deferred.min.css \
            && echo "  ok  .deploy/dist/style-deferred.min.css" \
            || { echo "  FAIL .deploy/dist/style-deferred.min.css missing"; exit 1; }
          test -f .deploy/dist/main.min.js \
            && echo "  ok  .deploy/dist/main.min.js" \
            || { echo "  FAIL .deploy/dist/main.min.js missing"; exit 1; }
          # Critical CSS is inlined into the BUILT copy of index.html
          grep -q '<style>' .deploy/index.html \
            && echo "  ok  inlined critical CSS in .deploy/index.html" \
            || { echo "  FAIL critical CSS not inlined in .deploy/index.html"; exit 1; }

      - name: Verify cache-bust hash in .deploy/index.html
        run: |
          grep -q 'dist/main.min.js?v=' .deploy/index.html \
            && echo "  ok  cache-bust hash present" \
            || { echo "  FAIL cache-bust hash missing in .deploy/index.html"; exit 1; }

      - name: Check performance budget
        run: node scripts/performance-budget.js

  summary:
    name: Compliance Summary
    runs-on: ubuntu-latest
    needs: [seo-validation, security-audit, bundle-integrity]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          failed=0
          for entry in \
            "seo-validation:${{ needs.seo-validation.result }}" \
            "security-audit:${{ needs.security-audit.result }}" \
            "bundle-integrity:${{ needs.bundle-integrity.result }}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "$result" = "failure" ]; then
              echo "  FAIL $name"
              failed=1
            else
              echo "  ok   $name ($result)"
            fi
          done
          echo ""
          echo "Compliance checks completed."
          echo "Review the detailed logs above for any warnings or failures."
          exit $failed
