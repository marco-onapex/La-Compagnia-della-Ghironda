# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver: major.minor.patch)"
        required: true
        type: string

# Least-privilege default. Validation/build/lighthouse jobs are read-only;
# the create-release job escalates explicitly to contents:write to push the
# tag and create the GitHub Release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  CACHE_VERSION: v3

jobs:
  validate-version:
    name: Validate semver input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        # Need full tag list to verify uniqueness below.
        with:
          fetch-depth: 0

      - name: Check semver format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: '$VERSION' is not a valid semver (expected: major.minor.patch)"
            exit 1
          fi
          echo "  ok  version $VERSION"

      - name: Verify tag does not already exist
        # Round-21 hardening: concurrency group has
        # `cancel-in-progress: false` (correct — releases must run to
        # completion), but two simultaneous workflow_dispatches with
        # the SAME version number race against `softprops/action-gh-release`
        # at the create-release step. The second one fails mid-publish
        # with half-created state. Catch the duplicate here, before
        # validate / e2e / build burn 25+ minutes of CI for nothing.
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if git tag --list "v$VERSION" | grep -q .; then
            echo "::error::Tag v$VERSION already exists. Pick a new version,"
            echo "::error::or delete the tag manually first if intentional"
            echo "::error::(\`git tag -d v$VERSION && git push --delete origin v$VERSION\`)."
            exit 1
          fi
          echo "  ok  v$VERSION is unique"

  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-version
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ env.CACHE_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      # Round 20 (option B): scripts.test.js's smoke suites require
      # `.deploy/` to exist. Build first so the full 215-test suite
      # gates the release; without this only 213 run.
      - name: Production build (unlocks full test suite)
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit:ci

      - name: Lint
        run: npm run lint:parallel

      - name: Type-check JSDoc (TypeScript checkJs)
        run: npm run typecheck

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Security audit
        run: npm run audit:security

  e2e-validate:
    name: E2E Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-version
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ env.CACHE_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.CACHE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ env.CACHE_VERSION }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Round 20 (option B): the dev-server (spawned by Playwright's
      # webServer config) serves `.deploy/`. Build is mandatory.
      - name: Production build (populates .deploy/ for dev-server)
        run: npm run build

      - name: Run E2E tests (Chromium, fresh build)
        run: npm run test:e2e -- --workers=1 --project=chromium
        timeout-minutes: 15

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, e2e-validate]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ env.CACHE_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Production build (full round-20 chain → .deploy/)
        # Round 20 (option B): `npm run build` runs the canonical chain
        # (build:css || build:js → build:assets → build:sitemap →
        # build:cache-bust → build:csp → build:strip → size-report →
        # audit:performance → docs:numbers). A partial chain would
        # break build:cache-bust (which now reads .deploy/ font +
        # image bytes for the composite hash). NODE_ENV=production
        # is set automatically by `npm run build` for build:js so the
        # sourcemap is stripped from .deploy/dist/main.min.js.
        run: npm run build

      - name: Verify auto-injected doc numbers were committed
        # Replaces the pre-round-20 `git diff -- dist/ index.html`
        # gate (now tautological — `dist/` is gitignored, source
        # `index.html` is never mutated by the build). Semantic
        # equivalent: the build's `docs:numbers` step refreshes
        # `<!-- AUTO:KEY -->...<!-- /AUTO -->` markers in tracked
        # docs; any diff means the release author shipped stale
        # marker values.
        run: |
          if ! git diff --quiet; then
            echo "::error::Source files differ from a fresh \`npm run build\`."
            echo "::error::This usually means \`docs:numbers\` refreshed"
            echo "::error::AUTO markers that the release branch missed."
            echo "::error::Run \`npm run build\` locally, commit the marker"
            echo "::error::updates, and re-trigger the release."
            git diff --stat
            exit 1
          fi
          echo "  ok  source clean — release artefact matches committed AUTO markers"

      - name: Verify .deploy/ outputs
        run: |
          test -f .deploy/dist/style-deferred.min.css || { echo "FAIL: deferred CSS bundle missing"; exit 1; }
          test -f .deploy/dist/main.min.js            || { echo "FAIL: JS bundle missing";          exit 1; }
          grep -q '<style>' .deploy/index.html        || { echo "FAIL: critical CSS not inlined";   exit 1; }
          grep -q 'dist/main.min.js?v=' .deploy/index.html \
            || { echo "FAIL: cache-bust hash missing in .deploy/index.html"; exit 1; }
          test ! -f .deploy/dist/main.min.js.map      || { echo "FAIL: sourcemap shipped to release"; exit 1; }
          echo "  ok  .deploy/ artefact ready for release"

      - name: Performance budget check
        # `audit:performance` runs as part of `npm run build`, but
        # invoke explicitly here so a budget overrun appears in its
        # own CI step rather than buried in the build log.
        run: node scripts/performance-budget.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ github.event.inputs.version }}
          # Round 20: the canonical release artefact is `.deploy/`,
          # which is what gets force-pushed to `gh-pages`. Keep the
          # archive shape symmetric with `deploy.yml`'s output.
          path: .deploy/
          retention-days: 90

  # ─── Lighthouse audit (blocking for releases — no continue-on-error) ──────────
  #
  # Round-21 hardening: parity with `test.yml` lighthouse job.
  #   1. matrix [desktop, mobile] — release.yml previously gated only
  #      desktop, so a mobile perf regression could ship a tagged
  #      release. Mobile is the primary user surface for this site.
  #   2. best-of-3 retry — single-attempt was vulnerable to simulator
  #      variance (mobile FCP can jitter ±400ms on identical inputs,
  #      flipping a 1.00 score to 0.97). The retry mirrors test.yml
  #      and uses scripts/enforce-lighthouse.js so the threshold
  #      logic stays in one canonical place.
  lighthouse:
    name: Lighthouse Audit (Release Gate, ${{ matrix.preset }})
    runs-on: ubuntu-latest
    needs: build-release
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preset: [desktop, mobile]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ env.CACHE_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Download build artifacts
        # Round 20: artifact contents are the contents of `.deploy/`.
        # Restore that layout so dev-server (which serves <ROOT>/.deploy)
        # finds the files it expects.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build-${{ github.event.inputs.version }}
          path: .deploy/
          merge-multiple: true

      - name: Start local server
        run: |
          TEST_MODE=1 node scripts/dev-server.js &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000 > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000 > /dev/null \
            || { echo "  FAIL dev-server did not respond on :8000 within 15s"; exit 1; }
          echo "  ok  server ready on :8000"

      - name: Run Lighthouse audit (${{ matrix.preset }}, best of 3)
        # Run up to 3 times and keep the report that hit Performance
        # 100 (or the last-best Performance score otherwise). Mirrors
        # the variance-mitigation approach in test.yml. Without the
        # retry, simulator jitter sporadically fails an otherwise
        # passing build — and worse, sporadically passes a real
        # regression that happened to land a lucky run.
        run: |
          best_perf=-1
          best_report=""
          for attempt in 1 2 3; do
            echo "=== Lighthouse ${{ matrix.preset }} attempt $attempt/3 ==="
            npx lighthouse http://localhost:8000 \
              --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
              --preset=${{ matrix.preset }} \
              --output-path=./lighthouse-report-${{ matrix.preset }}-attempt-$attempt \
              --output=json \
              --output=html \
              --quiet
            perf=$(node -e "
              const r=JSON.parse(require('fs').readFileSync(
                './lighthouse-report-${{ matrix.preset }}-attempt-$attempt.report.json','utf8'));
              process.stdout.write(String(Math.round(r.categories.performance.score*100)));
            ")
            echo "  Performance: $perf / 100"
            if [ "$perf" -gt "$best_perf" ]; then
              best_perf=$perf
              best_report=$attempt
            fi
            if [ "$perf" = "100" ]; then
              echo "  hit 100 — early exit"
              break
            fi
          done
          echo "Best run: attempt $best_report (Performance $best_perf)"
          cp ./lighthouse-report-${{ matrix.preset }}-attempt-$best_report.report.json \
             ./lighthouse-report-${{ matrix.preset }}.report.json
          cp ./lighthouse-report-${{ matrix.preset }}-attempt-$best_report.report.html \
             ./lighthouse-report-${{ matrix.preset }}.report.html

      - name: Enforce Lighthouse thresholds (${{ matrix.preset }}, blocking)
        # Reuse the same enforcement script test.yml uses (single
        # source-of-truth for thresholds: 100/100/100/100). The
        # `BLOCKING=true` env is authoritative — release ALWAYS blocks
        # on a sub-100 score regardless of dispatch path; the IS_PR
        # toggle is only for the test.yml workflow's PR-vs-push
        # distinction.
        env:
          BLOCKING: "true"
        run: node scripts/enforce-lighthouse.js ./lighthouse-report-${{ matrix.preset }}.report.json

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          # Matrix-aware artifact name so desktop and mobile reports
          # don't clobber each other.
          name: lighthouse-release-${{ github.event.inputs.version }}-${{ matrix.preset }}
          path: lighthouse-report-${{ matrix.preset }}.report.html
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-release, lighthouse]
    permissions:
      contents: write # softprops/action-gh-release pushes a tag + creates the release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log "${PREV}..HEAD" --pretty="format:- %s" \
              | grep -E "^- (feat|fix|perf|docs|BREAKING)" || true)
          else
            LOG=$(git log --pretty="format:- %s" \
              | grep -E "^- (feat|fix|perf|docs|BREAKING)" | head -20 || true)
          fi
          [ -z "$LOG" ] && LOG="- Maintenance release"
          # Grouped redirect to satisfy shellcheck SC2129 — one
          # `>>` invocation that emits the whole heredoc-style
          # multi-line `log<<EOF … EOF` block at once.
          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body: |
            ## La Compagnia della Ghironda — v${{ github.event.inputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.log }}

            ### Quality gates
            - All tests passing
            - Security audit passed (high severity)
            - Performance budget met
            - Lighthouse: performance ≥ 90, accessibility 100, best-practices 100, SEO 100
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts for release attachment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build-${{ github.event.inputs.version }}
          path: release-dist
          merge-multiple: true

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v${{ github.event.inputs.version }}
          path: |
            release-dist/
          retention-days: 90
