# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Hotfix Validation

on:
  push:
    branches:
      - "hotfix/**"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual hotfix run"
        required: false
        type: string

# Least-privilege: hotfix branches only run lint/test/build, no repo writes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  CACHE_VERSION: v3

jobs:
  # ─── STAGE 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint (HTML + CSS + JS)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ env.CACHE_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Lint all (HTML + CSS + JS in parallel)
        run: npm run lint:parallel

      - name: Type-check JSDoc (TypeScript checkJs)
        run: npm run typecheck

      - name: Security audit
        # Hotfix branches are exactly the place where a regressed dependency
        # might be reintroduced; running the audit here keeps the gate at
        # parity with the main `test.yml` workflow.
        run: npm run audit:security

  # ─── STAGE 2: Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ env.CACHE_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      # Round 20 (option B): scripts.test.js's smoke suites need
      # `.deploy/`. Build first so hotfix gating runs the full
      # 215-test suite, not 213.
      - name: Production build (unlocks full test suite)
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:unit:ci

  # ─── STAGE 3: E2E Tests (Chromium only — fast path) ─────────────────────────
  e2e-tests:
    name: E2E Tests (Chromium fast-path)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ env.CACHE_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.CACHE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ env.CACHE_VERSION }}-

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      # Round 20 (option B): the dev-server (spawned by Playwright's
      # webServer config) serves `.deploy/`. Build is mandatory.
      - name: Production build (populates .deploy/ for dev-server)
        run: npm run build

      - name: Run E2E tests (Chromium, 1 worker)
        run: npm run test:e2e -- --workers=1 --project=chromium
        timeout-minutes: 12

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hotfix-playwright-report
          path: test-results/
          retention-days: 7

  # ─── SUMMARY ────────────────────────────────────────────────────────────────
  summary:
    name: Hotfix Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          failed=0
          for entry in \
            "lint:${{ needs.lint.result }}" \
            "unit-tests:${{ needs.unit-tests.result }}" \
            "e2e-tests:${{ needs.e2e-tests.result }}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "$result" = "failure" ]; then
              echo "  FAIL $name"
              failed=1
            else
              echo "  ok   $name ($result)"
            fi
          done
          exit $failed

      - name: Write job summary
        if: always()
        run: |
          echo "## Hotfix Validation — ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests (Chromium) | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.reason }}" ]; then
            echo "**Reason:** ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          fi
