version: 2
updates:
  # npm dependencies (devDependencies — no runtime deps in this static site)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "marco-onapex"
    labels:
      - "dependencies"
      - "automation"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      eslint-stack:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
          - "eslint-config-prettier"
      jest-stack:
        patterns:
          - "jest"
          - "jest-*"
          - "babel-jest"
          - "@babel/*"
      playwright-stack:
        patterns:
          - "@playwright/*"
          - "axe-playwright"
      stryker-stack:
        patterns:
          - "@stryker-mutator/*"
      lint-stack:
        patterns:
          - "stylelint"
          - "stylelint-*"
          - "htmlhint"
      tooling-stack:
        patterns:
          - "husky"
          - "lint-staged"
          - "@commitlint/*"
          - "commitlint"
          - "cross-env"
          - "npm-run-all"
      types-stack:
        patterns:
          - "typescript"
          - "@types/*"

  # GitHub Actions — Dependabot bumps SHA + comment on every release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    reviewers:
      - "marco-onapex"
    labels:
      - "dependencies"
      - "ci"
      - "automation"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
