name: Bug report
description: Something is broken on the site or in the build pipeline.
labels: [bug]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered list of actions; include URL, viewport, and OS/browser version.
      placeholder: |
        1. Open https://marco-onapex.github.io/La-Compagnia-della-Ghironda/ on Chrome 132 / Windows 11.
        2. Resize the viewport to 375 × 667.
        3. Click the hamburger menu.
        4. Observe: …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, browser, browser version, viewport size"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context (logs, screenshots, network HAR)
